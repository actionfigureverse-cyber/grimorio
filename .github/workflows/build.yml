name: Compila Grimorio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  apk:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.sito.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Catalogo
        run: pip install requests && python scripts/build_catalog.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compila APK
        run: gradle --no-daemon assembleRelease && cp app/build/outputs/apk/release/app-release.apk Grimorio.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Grimorio ${{ github.run_number }}
          make_latest: true
          files: Grimorio.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets
      - id: sito
        uses: actions/deploy-pages@v4
